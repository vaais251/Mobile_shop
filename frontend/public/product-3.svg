<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="phoneGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2027;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#203a43;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c5364;stop-opacity:1" />
    </linearGradient>
    <filter id="phoneShadow3">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="200" cy="200" r="180" fill="url(#bgGrad3)" opacity="0.15"/>
  
  <!-- Phone Body -->
  <rect x="100" y="50" width="200" height="300" rx="25" fill="url(#phoneGrad3)" filter="url(#phoneShadow3)"/>
  
  <!-- Screen -->
  <rect x="110" y="70" width="180" height="260" rx="15" fill="#0c1e2e"/>
  
  <!-- Notch -->
  <rect x="160" y="70" width="80" height="20" rx="10" fill="#1a3447"/>
  
  <!-- Camera -->
  <circle cx="185" cy="80" r="4" fill="#0891b2" stroke="#06b6d4" stroke-width="1"/>
  <circle cx="200" cy="80" r="4" fill="#0891b2" stroke="#06b6d4" stroke-width="1"/>
  <circle cx="215" cy="80" r="4" fill="#0891b2" stroke="#06b6d4" stroke-width="1"/>
  
  <!-- Screen Shine -->
  <rect x="115" y="75" width="60" height="250" rx="10" fill="white" opacity="0.08"/>
  
  <!-- Volume Buttons -->
  <rect x="95" y="120" width="5" height="30" rx="2.5" fill="#1a3447"/>
  <rect x="95" y="160" width="5" height="30" rx="2.5" fill="#1a3447"/>
  
  <!-- Power Button -->
  <rect x="300" y="140" width="5" height="40" rx="2.5" fill="#1a3447"/>
</svg>
