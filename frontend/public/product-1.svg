<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="phoneGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <filter id="phoneShadow">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="200" cy="200" r="180" fill="url(#bgGrad1)" opacity="0.15"/>
  
  <!-- Phone Body -->
  <rect x="100" y="50" width="200" height="300" rx="25" fill="url(#phoneGrad1)" filter="url(#phoneShadow)"/>
  
  <!-- Screen -->
  <rect x="110" y="70" width="180" height="260" rx="15" fill="#0f172a"/>
  
  <!-- Notch -->
  <rect x="160" y="70" width="80" height="20" rx="10" fill="#1a1a2e"/>
  
  <!-- Camera -->
  <circle cx="185" cy="80" r="4" fill="#4c1d95" stroke="#8b5cf6" stroke-width="1"/>
  <circle cx="200" cy="80" r="4" fill="#4c1d95" stroke="#8b5cf6" stroke-width="1"/>
  <circle cx="215" cy="80" r="4" fill="#4c1d95" stroke="#8b5cf6" stroke-width="1"/>
  
  <!-- Screen Shine -->
  <rect x="115" y="75" width="60" height="250" rx="10" fill="white" opacity="0.05"/>
  
  <!-- Volume Buttons -->
  <rect x="95" y="120" width="5" height="30" rx="2.5" fill="#0f172a"/>
  <rect x="95" y="160" width="5" height="30" rx="2.5" fill="#0f172a"/>
  
  <!-- Power Button -->
  <rect x="300" y="140" width="5" height="40" rx="2.5" fill="#0f172a"/>
</svg>
