<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle with Gradient -->
  <circle cx="60" cy="60" r="58" fill="url(#logoGradient)" opacity="0.1"/>
  
  <!-- S Letter -->
  <path d="M35 45 Q35 30, 50 30 L70 30 Q75 30, 75 35 Q75 40, 70 40 L50 40 Q45 40, 45 45 Q45 50, 50 50 L70 50 Q85 50, 85 65 Q85 80, 70 80 L50 80 Q35 80, 35 65" 
        stroke="url(#logoGradient)" 
        stroke-width="6" 
        fill="none" 
        stroke-linecap="round"
        filter="url(#glow)"/>
  
  <!-- M Letter -->
  <path d="M45 75 L45 35 L60 55 L75 35 L75 75" 
        stroke="url(#logoGradient)" 
        stroke-width="6" 
        fill="none" 
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"
        transform="translate(15, 0)"/>
</svg>
