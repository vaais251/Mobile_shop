<svg width="600" height="800" viewBox="0 0 600 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#312e81;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Phone Body -->
  <rect x="100" y="50" width="400" height="700" rx="50" fill="url(#phoneGrad)" filter="url(#shadow)"/>
  
  <!-- Screen -->
  <rect x="120" y="80" width="360" height="640" rx="30" fill="url(#screenGrad)"/>
  
  <!-- Notch -->
  <rect x="250" y="80" width="100" height="25" rx="12" fill="#1e1b4b"/>
  
  <!-- Camera -->
  <circle cx="280" cy="92" r="6" fill="#4c1d95" stroke="#7c3aed" stroke-width="1"/>
  <circle cx="300" cy="92" r="6" fill="#4c1d95" stroke="#7c3aed" stroke-width="1"/>
  <circle cx="320" cy="92" r="6" fill="#4c1d95" stroke="#7c3aed" stroke-width="1"/>
  
  <!-- Screen Content - App Icons Grid -->
  <g opacity="0.6">
    <!-- Row 1 -->
    <rect x="140" y="140" width="70" height="70" rx="15" fill="#8b5cf6"/>
    <rect x="230" y="140" width="70" height="70" rx="15" fill="#6366f1"/>
    <rect x="320" y="140" width="70" height="70" rx="15" fill="#a855f7"/>
    <rect x="410" y="140" width="70" height="70" rx="15" fill="#7c3aed"/>
    
    <!-- Row 2 -->
    <rect x="140" y="230" width="70" height="70" rx="15" fill="#6366f1"/>
    <rect x="230" y="230" width="70" height="70" rx="15" fill="#a855f7"/>
    <rect x="320" y="230" width="70" height="70" rx="15" fill="#8b5cf6"/>
    <rect x="410" y="230" width="70" height="70" rx="15" fill="#6366f1"/>
    
    <!-- Row 3 -->
    <rect x="140" y="320" width="70" height="70" rx="15" fill="#7c3aed"/>
    <rect x="230" y="320" width="70" height="70" rx="15" fill="#8b5cf6"/>
    <rect x="320" y="320" width="70" height="70" rx="15" fill="#6366f1"/>
    <rect x="410" y="320" width="70" height="70" rx="15" fill="#a855f7"/>
  </g>
  
  <!-- Shine Effect -->
  <rect x="130" y="90" width="120" height="600" rx="20" fill="white" opacity="0.1"/>
  
  <!-- Volume Buttons -->
  <rect x="95" y="200" width="10" height="60" rx="5" fill="#4c1d95"/>
  <rect x="95" y="280" width="10" height="60" rx="5" fill="#4c1d95"/>
  
  <!-- Power Button -->
  <rect x="495" y="240" width="10" height="80" rx="5" fill="#4c1d95"/>
</svg>
